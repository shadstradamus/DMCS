name: Repair DMCS 1.3.3 data

on:
  push:
    branches:
      - chore/release-alignment-1.3.3

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Correct malformed sector classification values and resync data
        run: |
          python - <<'PY'
          import csv
          import json
          import shutil
          from pathlib import Path

          root = Path('.')
          json_path = root / 'data' / 'classification.json'
          with json_path.open('r', encoding='utf-8') as fh:
              data = json.load(fh)

          changed = []
          for industry in data['industries']:
              if industry['id'] != '04':
                  continue
              for sector in industry['sectors']:
                  if sector['id'] in {'04.03', '04.04'} and sector.get('classification') != 'GIC':
                      changed.append((sector['id'], sector.get('classification'), 'GIC'))
                      sector['classification'] = 'GIC'

          json_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          shutil.copyfile(json_path, root / 'python-sdk' / 'dmcs_sdk' / 'data' / 'classification.json')
          shutil.copyfile(json_path, root / 'typescript-sdk' / 'src' / 'data' / 'classification.json')

          csv_path = root / 'data' / 'classification.csv'
          fieldnames = [
              'level', 'id', 'label', 'parent_id', 'industry_id',
              'sector_id', 'classification', 'since', 'status'
          ]

          rows = []
          for industry in data['industries']:
              rows.append({
                  'level': industry['level'],
                  'id': industry['id'],
                  'label': industry['label'],
                  'parent_id': industry.get('parent_id') or '',
                  'industry_id': industry.get('industry_id') or '',
                  'sector_id': industry.get('sector_id') or '',
                  'classification': industry['classification'],
                  'since': industry['since'],
                  'status': industry['status'],
              })
              for sector in industry['sectors']:
                  rows.append({
                      'level': sector['level'],
                      'id': sector['id'],
                      'label': sector['label'],
                      'parent_id': sector.get('parent_id') or industry['id'],
                      'industry_id': sector.get('industry_id') or industry['id'],
                      'sector_id': sector.get('sector_id') or sector['id'],
                      'classification': sector['classification'],
                      'since': sector['since'],
                      'status': sector['status'],
                  })
                  for subsector in sector['subsectors']:
                      rows.append({
                          'level': subsector['level'],
                          'id': subsector['id'],
                          'label': subsector['label'],
                          'parent_id': subsector.get('parent_id') or sector['id'],
                          'industry_id': subsector.get('industry_id') or industry['id'],
                          'sector_id': subsector.get('sector_id') or sector['id'],
                          'classification': subsector['classification'],
                          'since': subsector['since'],
                          'status': subsector['status'],
                      })
                      for segment in subsector.get('segments', []):
                          rows.append({
                              'level': segment['level'],
                              'id': segment['id'],
                              'label': segment['label'],
                              'parent_id': segment.get('parent_id') or subsector['id'],
                              'industry_id': segment.get('industry_id') or industry['id'],
                              'sector_id': segment.get('sector_id') or sector['id'],
                              'classification': segment['classification'],
                              'since': segment['since'],
                              'status': segment['status'],
                          })

          with csv_path.open('w', encoding='utf-8', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=fieldnames, quoting=csv.QUOTE_ALL, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          shutil.copyfile(csv_path, root / 'python-sdk' / 'dmcs_sdk' / 'data' / 'classification.csv')

          print('Corrections:', changed)
          print('Rows:', len(rows))
          PY

      - name: Validate repaired data before commit
        run: python scripts/validate_release.py

      - name: Commit repair when needed
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classification.json data/classification.csv \
            python-sdk/dmcs_sdk/data/classification.json \
            python-sdk/dmcs_sdk/data/classification.csv \
            typescript-sdk/src/data/classification.json
          git commit -m "fix(data): correct malformed consumer sector classifications"
          git push
